services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: research_db
      TZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tune postgres to stay lean — enough for a small research DB with pgvector
    command: >
      postgres -c shared_buffers=128MB -c work_mem=8MB -c maintenance_work_mem=64MB -c max_connections=20
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app_network

  model_api:
    build:
      context: ./model_api
      args:
        - HF_TOKEN=${HF_TOKEN}
    ports:
      - "8008:8000"
    volumes:
      - ./model_api:/app
      - ./model_api/cache:/root/.cache
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Point to the Ollama instance running natively on the Windows host.
      # extra_hosts below injects host.docker.internal → host-gateway for WSL2
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - TEXT_MODEL=${TEXT_MODEL:-gemma4:e2b}
      - VISION_MODEL=${VISION_MODEL:-gemma4:e2b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G # Specter2 weights ~440MB + PyTorch runtime ~300MB
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # Specter2 may download ~440MB weights on first boot
    networks:
      - app_network

  # The backend orchestration
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      # URLs to speak to other containers
      - MODEL_API_URL=http://model_api:8000
      - DATABASE_URL=postgresql+psycopg2://research_user:secure_password@postgres:5432/research_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./EXTRACT:/app/EXTRACT
      - ./data_pdf:/app/data_pdf
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M # FastAPI serving + light PyMuPDF ops
    depends_on:
      - postgres
      - model_api
      - redis
    networks:
      - app_network

  celery_worker:
    build:
      context: ./backend
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql+psycopg2://research_user:secure_password@postgres:5432/research_db
      - REDIS_URL=redis://redis:6379/0
      - MODEL_API_URL=http://model_api:8000
    volumes:
      - ./backend:/app
      - ./EXTRACT:/app/EXTRACT
      - ./data_pdf:/app/data_pdf
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M # PyMuPDF + pdfplumber peak during PDF ingestion
    depends_on:
      - postgres
      - redis
      - model_api
    networks:
      - app_network

  # The React frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M # Vite dev server idles at ~100-150MB
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
