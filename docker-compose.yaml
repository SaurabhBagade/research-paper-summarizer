services:
  chromadb:
    image: chromadb/chroma:1.5.3.dev5
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ALLOW_RESET=TRUE
    volumes:
      - ./EXTRACT/vectorstore:/chroma/chroma
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - app_network

  mongodb:
    image: mongo:8.2-rc
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - app_network

  model_api:
    build:
      context: ./model_api
      args:
        - HF_TOKEN=${HF_TOKEN}
    ports:
      - "8008:8000"
    volumes:
      - ./model_api:/app
      - ./model_api/cache:/root/.cache
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - OLLAMA_URL=http://ollama:11434
      - TEXT_MODEL=mistral
      - VISION_MODEL=moondream
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app_network

  # The backend orchestration
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      # URLs to speak to other containers
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - MODEL_API_URL=http://model_api:8000
      - MONGO_URI=mongodb://mongodb:27017
    volumes:
      - ./backend:/app
      - ./EXTRACT:/app/EXTRACT
      - ./data_pdf:/app/data_pdf
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - chromadb
      - model_api
      - mongodb
    networks:
      - app_network

  # The React frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    restart: always
    deploy:
      resources:
        limits:
          memory: 0.5G
    depends_on:
      - backend
    networks:
      - app_network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=1000000000
      - OLLAMA_CONTEXT_LENGTH=4k
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
  ollama_data:


